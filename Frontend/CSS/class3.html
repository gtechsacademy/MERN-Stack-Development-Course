<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 3 - CSS</title>
    <style>
        /* Universal Selector */
        * {
            margin: 0;
            padding: 0;
            /* color: red; */
        }

        /* Tag Selector */
        /* h1{ color: yellow; }

        h2{ color: red; }

        p{ color: blue; } */

        .heading{
            color: red;
        }

        #abc{
            color: chocolate;
        }

        .para{ color: blue; }

        .new{ font-size: 35px; }

    </style>
</head>

<body>

    <h1 class="heading">Welcome to CSS class 3</h1>
    <h2 id="abc">This is my second heading</h2>
    <p class="para new">Lorem ipsum dolor sit amet.</p>


</body>

</html>
