<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Class</title>
</head>
<body>
    <!-- Heading Tags -->
    <h1>This is H1 Tag</h1>
    <h2>This is H2 Tag</h2>
    <h3>This is H3 Tag</h3>
    <h4>This is H4 Tag</h4>
    <h5>This is H5 Tag</h5>
    <h6>This is H6 Tag</h6>


    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Cupiditate, dolorum?</p>

    <!-- Text Formatting Tags -->
    <b>Hello</b>
    <strong>Hello 2</strong>
    <i>Italic</i>
    <em>Italic 2</em>
    <del>999</del>
    <u>Under line</u>
    <mark>Highlight</mark>
    2<sup>4</sup> = 16
    H<sub>2</sub>O
    <code>var a = 5; </code>
    
    <br> <!-- Line Break tag -->

    Helllo <br>
    Helllo 2 <br> Hello Again

    <hr> <!-- Horizontal Line -->

</body>
</html>
