<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>

    <form action="">

        <fieldset>
            <legend>Registration Form</legend>

            <label for="">Name*: </label>
            <input type="text" placeholder="Enter your name" required> <br> <br>

            <label for="">Email*: </label>
            <input type="email" placeholder="Enter your Email" required> <br> <br>

            <label for="">Password*</label>
            <input type="password" required> <br> <br>

            <label for="">Enter your DOB</label>
            <input type="date"> <br> <br>

            <label for="">Enter your Time</label>
            <input type="time"> <br> <br>

            <label for="">Enter your fav color</label>
            <input type="color"> <br> <br>

            <label for="">Select your gender</label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female <br> <br>

            <label for="">Select your city</label>
            <select name="" id="">
                <option value="" selected disabled>Chooese your city</option>
                <option value="">Delhi</option>
                <option value="">Noida</option>
                <option value="">Lucknow</option>
                <option value="">Bihar</option>
            </select> <br> <br>

            <label for="">Enter your mob no</label>
            <input type="number" value="100"> <br> <br>

            <label for="">Enter your age</label>
            <input type="number" value="18" readonly> <br> <br>

            <label for="">Enter range</label>
            <input type="range" max="10" step="5"> <br> <br>

            <label for="">Upload your photo</label>
            <input type="file"> <br> <br>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
            <button type="button">Normal</button>

        </fieldset>

    </form>

</body>

</html>
